system:
  environment: "development"
  log_level: "INFO"

preprocessor:
  remove_diacritics: true
  unify_hamzas: true
  remove_tatweel: true
  chunk_size: 450
  chunk_overlap: 80

retrieval:
  collection_name: "arabic_legal_docs"
  dense_model_name: "intfloat/multilingual-e5-base"
  embedding_dimension: 768
  bm25_k1: 1.5
  bm25_b: 0.75
  rrf_k: 60
  top_k_candidates: 20
  final_top_k: 5
  reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  enable_reranker: true

generation:
  model_name: "meta-llama/Meta-Llama-3-8B-Instruct"
  max_new_tokens: 512
  temperature: 0.1
  top_p: 0.9
